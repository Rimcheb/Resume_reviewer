{% extends "base.html" %}
{% block title %}Log in | Resume Reviewer{% endblock %}
{% block page_class %} narrow-page{% endblock %}
{% block content %}
<header class="page-heading">
    <div><h1>Log in</h1><p>Share your resume and get feedback from peers.</p></div>
</header>
{% if error %}<p class="message-error" role="alert">{{ error }}</p>{% endif %}
<form class="card editor" method="post" action="{{ url_for('auth.login', next=next_url) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254"
           autocomplete="email" value="{{ email }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128"
           autocomplete="current-password" required>
    <button type="submit">Log in</button>
</form>
<p class="after-card"><a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
