{% extends "base.html" %}
{% block title %}Your account | Resume Reviewer{% endblock %}
{% block content %}
<h2>Your account</h2>
<p>You are logged in as {{ g.user["email"] }}.</p>
<p><a href="{{ url_for('resumes.new') }}">Submit a resume</a></p>
<form method="post" action="{{ url_for('auth.review_fields') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% include "field_checkboxes.html" %}
    <button type="submit">Save fields</button>
</form>
<form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Log out</button>
</form>
{% endblock %}
